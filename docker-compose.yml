version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: telegram_bot_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminadmin
      POSTGRES_DB: ReceipesProcessorDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  s3-storage:
    image: minio/minio:latest
    container_name: telegram_bot_s3
    restart: always
    ports:
      - "9000:9000" # Порт для подключения из C# кода
      - "9001:9001" # Веб-интерфейс (консоль)
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secure_password
    volumes:
      - s3data:/data
    command: server /data --console-address ":9001"

volumes:
  pgdata:
    driver: local
  s3data:
    driver: local